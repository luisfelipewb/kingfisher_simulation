# Example configuration to spawn a Kingfisher with competition.launch.py or
# spawn_config.launch.py:
#   ros2 launch vrx_gz competition.launch.py config_file:=<path>/kingfisher_spawn.yaml
# Spawning slightly above the water avoids the initial buoyancy bounce.
- model_name: kingfisher
  model_type: usv
  urdf: package://kingfisher_gazebo/urdf/kingfisher_gazebo.urdf.xacro
  position:
    xyz: [-532, 162, 0.12]
    rpy: [0, 0, 1]
